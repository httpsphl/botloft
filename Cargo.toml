[workspace]
resolver = "3"
members = ["crates/botloft-core", "crates/botloft-store", "crates/botloftd", "app/src-tauri", "app/src-setup"]
default-members = ["crates/botloft-core", "crates/botloft-store", "crates/botloftd"]

[workspace.package]
version = "0.11.0"
edition = "2024"
license = "FSL-1.1-ALv2"
repository = "https://github.com/httpsphl/botloft"
authors = ["Phelipe Lorran"]

[workspace.dependencies]
botloft-core = { path = "crates/botloft-core" }
botloft-store = { path = "crates/botloft-store" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

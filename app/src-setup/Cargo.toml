[package]
name = "botloft-setup"
description = "Botloft setup window: runs the NSIS installer it carries, quietly"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2", features = [] }

[target."cfg(windows)".dependencies]
winreg = "0.55.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[lints]
workspace = true

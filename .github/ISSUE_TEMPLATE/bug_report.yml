name: Bug report
description: Something in Botloft does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please leave out anything private: bot conversations, file contents,
        tokens or names you would not post publicly.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a crew with ...
        2. Send ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Botloft version
      description: Settings > About shows it.
      placeholder: "0.8.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: Settings > About shows it too. Most useful when the problem involves bots.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Anything that helps. Check logs for private content before pasting.
      render: text

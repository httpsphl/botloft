name: Idea or feature request
description: Something Botloft could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The situation and what gets in the way today. A real example helps most.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
      description: Your idea, if you have one. Rough is fine.
  - type: checkboxes
    id: help
    attributes:
      label: Building it
      options:
        - label: I would like to work on this myself.

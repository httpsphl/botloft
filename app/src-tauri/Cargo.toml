[package]
name = "botloft-app"
description = "Botloft desktop app (Tauri shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# otherwise collides on Windows (rust-lang/cargo#8519).
name = "botloft_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2.5.0"
tauri-plugin-single-instance = "2.5.1"
tauri-plugin-updater = "2"
toml = "1.1.6"

[target."cfg(windows)".dependencies]
winreg = "0.55.0"

[lints]
workspace = true
